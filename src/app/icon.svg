<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fde9ef"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Download tray -->
  <path d="M9 18.5 v3 a2 2 0 0 0 2 2 h10 a2 2 0 0 0 2 -2 v-3"
        fill="none" stroke="white" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <!-- Down arrow -->
  <path d="M16 7.5 v8 m0 0 l-3.5 -3.5 m3.5 3.5 l3.5 -3.5"
        fill="none" stroke="url(#arrow)" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
